[project]
name = "prime-agent-skill-bailian-web-search"
version = "0.1.0"
description = "Web search skill for Prime Agent (Bailian enable_search, max strategy, public endpoint)."
requires-python = ">=3.10"
dependencies = ["prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bailian_web_search"]
