# Version policy: this Python runtime is OUTSIDE the npm lockstep (root + packages/*).
# It evolves independently; see docs/fork/lockstep-scope.md for the boundary and the
# reason (consumed by content sha256, not by npm version; not a node workspace).
[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "tyro",
]

[dependency-groups]
dev = ["dill"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
