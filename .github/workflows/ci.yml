name: CI

on:
  push:
    # merge/repl-kernel is this fork's main branch. Without it, day-to-day pushes here never run
    # CI at all and the jobs below only execute for upstream pull requests (base main).
    branches: [main, merge/repl-kernel]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trust:
    name: Contributor trust
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ github.event_name == 'push' || steps.vouch.outputs.vouched == 'true' }}
    steps:
      - name: Check pull request author
        id: vouch
        if: github.event_name == 'pull_request'
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1
        with:
          user: ${{ github.event.pull_request.user.login }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-check:
    name: Build and check
    needs: trust
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `.npmrc` sets `min-release-age=7`, a key npm 11.10 introduced. Node 22 (what
      # `node-version: 22` installs here) ships npm 10.x, and npm 10 never errors on that key -
      # it ignores it silently, so the cooldown was absent exactly where dependencies get
      # resolved. Pin a fixed npm version instead of the bundled one: not a floating tag, so the
      # job cannot drift onto an npm that behaves differently. `--min-release-age=0` is required
      # on this command because the install fetches npm itself and runs under this repository's
      # `.npmrc`: without it, a release of npm published less than 7 days ago would be refused by
      # the very key being installed.
      - name: Pin npm (min-release-age needs npm >= 11.10)
        run: npm install -g --min-release-age=0 --ignore-scripts --no-audit --no-fund npm@11.12.0

      # The pin is only worth something if it is checked. This gate is red when the npm in use is
      # older than 11.10 (the silent-ignore shape, which would leave `.npmrc`'s cooldown enforcing
      # nothing) or when `.npmrc` does not ask for a cooldown of at least one day. `--self-test`
      # runs first and offline: it plants npm 10.9.4 and an `.npmrc` without the key and requires
      # the gate to turn red for both.
      - name: npm release-cooldown gate (npm >= 11.10 and .npmrc min-release-age >= 1)
        run: |
          node scripts/check-npm-release-cooldown.mjs --self-test
          node scripts/check-npm-release-cooldown.mjs

      # Online proof that the policy refuses what it says it refuses: the probe picks a version of
      # a churny package published *inside* the 7-day window, requires `npm install` to refuse it,
      # and requires the same command with `--min-release-age=0` to install it (positive control,
      # so a network or package-name failure cannot pass as a policy success). This job runs
      # `npm ci`, so it has the network the probe needs. A timeout, an unreachable registry or no
      # candidate version is a red probe with a reason, never a silent skip.
      - name: npm release-cooldown probe (live registry)
        run: node scripts/check-npm-release-cooldown.mjs --probe

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

  test:
    name: Test (${{ matrix.name }})
    needs: trust
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every vitest job writes a JSON report and hands it to
        # scripts/check-vitest-coverage.mjs. Before this only the kernel job was gated, so a job
        # could lose a file (or a whole face) to `describe.skip` and still succeed: the ai job
        # reported 458 passed | 722 skipped with 19 files running nothing, and shard 3 collected
        # test/repl-kernel-execute.test.ts as `6 skipped` although no job ever ran it.
        #
        # min_tests / min_ran_tests are floors, and the policy behind them is one sentence: a floor
        # is ceil(0.9 * what the job really produced) in the CI run recorded in
        # scripts/ci-floor-readings.json - run 35341768020, whose head sha (8ed6d73bc) is the commit
        # these floors were set on, so the reading and the tree being gated are the same tree. 90%
        # gives ordinary test churn room and makes a collapse (a suite that stops collecting, a job
        # that collects but never runs) red. Each row carries its own reading next to its floor.
        #
        # This sentence used to claim 90% while the numbers below it were 64%-87% of the real
        # readings (ai ran-floor 412 against 643 tests actually run, shard 2/3 2118 against 3107),
        # which is drift in the direction that hides a lost face. It cannot drift back:
        # packages/coding-agent/test/ci-floor-policy.test.ts recomputes ceil(0.9 * reading) from
        # that file and fails when a row disagrees, when a row has no recorded reading, or when the
        # recorded run's sha does not exist in this repository.
        #
        # max_nothing_files is how many files are allowed to run nothing in this job's environment;
        # every non-zero value is a deliberate skip with a reason, and one more skipping file fails
        # the job and names the file.
        #
        # Re-deriving a floor after test churn is mechanical, not a judgement call:
        #   gh run list -R Dmatut7/prime-agent-rlm --branch merge/repl-kernel --limit 5 \
        #     --json databaseId,headSha,conclusion
        #   gh run view <run id> -R Dmatut7/prime-agent-rlm --log \
        #     | grep -E 'numTotalTests=|tests=[0-9]+ ran='
        #   node scripts/check-vitest-coverage.mjs --recompute-floors <report.json> --row "<row name>"
        # then paste the reading into scripts/ci-floor-readings.json and the floors it prints here
        # (for the process smoke row, into scripts/lib/ci-process-smoke.mjs - ci.yml is pinned to it).
        # The three shard rows move whenever vitest re-shards: between two consecutive green runs
        # shard 2/3 gained 132 collected tests and shard 3/3 lost 118, with the suite total up 26.
        # A shard floor going stale is that churn, not a regression - recompute it.
        include:
          - name: agent-core
            package: packages/agent
            command: npm test --
            report: coverage/ci-agent-core.json
            # run 35341768020: collected=108 ran=108 files=9 nothing-files=0 -> ceil(0.9*x) = 98/98.
            min_tests: 98
            min_ran_tests: 98
            max_nothing_files: 0
            install_uv: false
          - name: ai
            package: packages/ai
            command: npm test --
            report: coverage/ci-ai.json
            # run 35341768020: collected=1365 ran=643 files=112 nothing-files=19 -> 1229/579. The
            # ran floor was 412, i.e. 64% of what the job runs: 167 tests (a third of this job's
            # running face) could have stopped running and the gate would still have said green.
            # The gap between collected and ran is the 19 nothing-files below, not hidden skips.
            min_tests: 1229
            min_ran_tests: 579
            # 19 files are the live-provider suites, which need credentials this job has none of.
            max_nothing_files: 19
            install_uv: false
          - name: tui
            package: packages/tui
            # `node --test`, not vitest: no vitest JSON report, so this row feeds its junit XML
            # (see the node --test steps below) to scripts/check-node-test-coverage.mjs instead.
            # The reporters are part of the command because node parses `--test-reporter` only
            # *before* the file list: appended after `npm test --`, the flags are silently
            # ignored and no report is written. A `# skipped 0` summary line only says what the
            # runner counted; the floors below are what pin the faces that actually ran.
            command: node --test --import tsx --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=coverage/ci-tui.xml test/*.test.ts
            report: ""
            node_test_report: coverage/ci-tui.xml
            # run 35341768020: tests=863 ran=863 suites=134 nothing-suites=0 -> 777/777. The
            # floors here are derived from the CI reading, not from a local run: this row used to
            # quote "831 tests on a full local run", a number no gate reads and no runner produces.
            min_tests: 777
            min_ran_tests: 777
            max_nothing_suites: 0
            install_uv: false
          - name: coding-agent 1/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=1/3
            report: coverage/ci-shard-1.json
            # run 35341768020: collected=2720 ran=2695 files=240 nothing-files=3 -> 2448/2426.
            min_tests: 2448
            min_ran_tests: 2426
            # compaction-extensions, rpc (both opt-in), bash-close-hang-windows (win32-only).
            max_nothing_files: 3
            install_uv: true
          - name: coding-agent 2/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=2/3
            report: coverage/ci-shard-2.json
            # run 35341768020: collected=3117 ran=3107 files=240 nothing-files=1 -> 2806/2797.
            # This row's budget says six kernel-heavy files but the run produced one nothing-file;
            # the budget is left as authored and the gap is recorded in scripts/ci-floor-readings.json.
            min_tests: 2806
            min_ran_tests: 2797
            # Six `kernel-heavy` files (tag-filtered here, run by the kernel job).
            max_nothing_files: 6
            install_uv: true
          - name: coding-agent 3/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=3/3
            report: coverage/ci-shard-3.json
            # run 35341768020: collected=2058 ran=2022 files=239 nothing-files=5 -> 1853/1820.
            # The previous green run collected 2176 here, so this row is the one most exposed to
            # re-sharding; 205 collected tests of slack absorb one more move of that size.
            min_tests: 1853
            min_ran_tests: 1820
            # Six `kernel-heavy` files (run by the kernel job) and agent-session-tree-navigation
            # (describe.skipIf(!API_KEY)). test/repl-kernel-execute.test.ts was the eighth until its
            # interpreter resolution was fixed; it runs here now, so this budget is what catches it
            # going back to `describe.skip`.
            max_nothing_files: 7
            install_uv: true
          - name: coding-agent process smoke
            package: packages/coding-agent
            command: npm run test:process --
            report: coverage/ci-process-smoke.json
            # run 35341768020: collected=24 ran=12 files=2 nothing-files=1 -> 22/11. These four
            # values and the ledger string below have one source: scripts/lib/ci-process-smoke.mjs,
            # which scripts/check-process-smoke.sh (the local mirror of this job) also reads. The
            # pin fails when this row and that module disagree, so the local mirror can no longer
            # gate at floors CI stopped using.
            min_tests: 22
            # This job runs 12 of the 24 tests it collects: the other 12 carry the `process-stress`
            # tag that vitest.config.ts filters out. The floor leaves one test of slack on purpose -
            # the ledger step below pins the twelve exactly and names any skip that moves.
            min_ran_tests: 11
            # The process-stress tests in these two files are the nightly job's face, not this one's.
            max_nothing_files: 1
            # What this job deliberately does not run, declared and counted. `;;` separates entries;
            # the reason names where those tests do run, and scripts/check-tag-skip-ledger.sh fails
            # the job when the report disagrees with this list in either direction.
            tag_skip_ledger: 'packages/coding-agent/test/daemon-supervisor-process.test.ts=8:process-stress tag-filtered by vitest.config.ts; nightly-process-stress.yml runs it;;packages/coding-agent/test/daemon-supervisor-crash-handlers-process.test.ts=4:process-stress tag-filtered by vitest.config.ts; nightly-process-stress.yml runs it'
            install_uv: true
          # 4603-worker-recovery drives the machine-wide discovery commands (`status`,
          # `doctor --fix`, `shutdown --force`): `daemon ps` finds every prime-agent
          # daemon on the host through `ss -lxp`/`lsof` rather than only its own socket
          # (see the header of src/cli/daemon-ps.ts). Run inside a shard, that reaps the
          # other files' session-less supervisors - in run 34753200385 it stopped 4606's
          # predecessor mid-test and reddened both files - and on a workstation it stops
          # the developer's live daemon. So it runs alone, in its own job on its own
          # runner, and `test:ci` excludes it.
          - name: coding-agent machine-wide
            package: packages/coding-agent
            command: npm run test:machine-wide --
            report: coverage/ci-machine-wide.json
            # run 35341768020: collected=6 ran=6 files=1 nothing-files=0 -> 6/6. ceil(0.9*6) is 6,
            # so this row has zero slack: it is one file with six tests that drive the machine-wide
            # discovery commands, and losing any of them must be loud rather than absorbed.
            min_tests: 6
            min_ran_tests: 6
            max_nothing_files: 0
            install_uv: true
          - name: coding-agent kernel
            package: packages/coding-agent
            command: npm run test:kernel:ci
            # `test:kernel:ci` writes the report and runs the same gate itself, so this row is not
            # gated twice and carries no floors here - they live in that script, in
            # packages/coding-agent/package.json. Its reading is recorded in
            # scripts/ci-floor-readings.json (row "coding-agent kernel") like every other row's and
            # the same 90% policy applies to it, but the numbers are deliberately not repeated in
            # this comment: a copy no gate compares is a copy that rots.
            report: ""
            install_uv: true
            seed_kernel_python: true
          - name: runtime python
            package: prime-agent-runtime
            command: uv run python -m unittest discover -s test
            report: ""
            install_uv: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `.npmrc` sets `min-release-age=7`, a key npm 11.10 introduced. Node 22 (what
      # `node-version: 22` installs here) ships npm 10.x, and npm 10 never errors on that key -
      # it ignores it silently, so the cooldown was absent exactly where dependencies get
      # resolved. Pin a fixed npm version instead of the bundled one: not a floating tag, so the
      # job cannot drift onto an npm that behaves differently. `--min-release-age=0` is required
      # on this command because the install fetches npm itself and runs under this repository's
      # `.npmrc`: without it, a release of npm published less than 7 days ago would be refused by
      # the very key being installed.
      - name: Pin npm (min-release-age needs npm >= 11.10)
        run: npm install -g --min-release-age=0 --ignore-scripts --no-audit --no-fund npm@11.12.0

      # The pin is only worth something if it is checked. This gate is red when the npm in use is
      # older than 11.10 (the silent-ignore shape, which would leave `.npmrc`'s cooldown enforcing
      # nothing) or when `.npmrc` does not ask for a cooldown of at least one day. `--self-test`
      # runs first and offline: it plants npm 10.9.4 and an `.npmrc` without the key and requires
      # the gate to turn red for both.
      - name: npm release-cooldown gate (npm >= 11.10 and .npmrc min-release-age >= 1)
        run: |
          node scripts/check-npm-release-cooldown.mjs --self-test
          node scripts/check-npm-release-cooldown.mjs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install uv
        if: matrix.install_uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The kernel-heavy files resolve a Python interpreter at module load and fall back to
      # `describe.skip` when none of the three candidates exists, and vitest exits 0 for a fully
      # skipped file: this job used to go green with 28 of its 36 tests never run. Seed the venv the
      # product itself builds, pin it for the rest of the job, and gate the report afterwards.
      - name: Seed the kernel venv and pin PRIME_AGENT_KERNEL_PYTHON
        if: matrix.seed_kernel_python
        env:
          # A runner is not a TTY, so without this a missing uv aborts the seed instead of installing.
          PRIME_AGENT_INSTALL_UV: "1"
          # Seed outside the managed base (~/.prime/agent/kernel-venv). A pinned interpreter that
          # lives under that base collects an in-use reference from every kernel the suite spawns,
          # and test/repl-kernel-generation-isolation.test.ts clones the seed venv and counts them.
          PRIME_AGENT_KERNEL_VENV: ${{ runner.temp }}/pi-kernel-venv
        run: |
          npx tsx packages/coding-agent/src/core/kernel/bootstrap-cli.ts --with-bundled-skills > kernel-python.log
          cat kernel-python.log
          kernel_python=$(sed -n 's/^kernel python: //p' kernel-python.log)
          test -n "$kernel_python"
          # rlm.repl + dill is what the gated files probe; goal and agent_message are what the two
          # self-bootstrapping files drive. A pin missing a skill only warns at boot and then fails
          # the test on a missing import, so prove the seed here instead.
          "$kernel_python" -P -c 'import rlm.repl, dill, goal, agent_message'
          echo "PRIME_AGENT_KERNEL_PYTHON=$kernel_python" >> "$GITHUB_ENV"

      # The default reporter keeps the human summary; the JSON report is what the coverage gate
      # reads. Jobs without a `report` (the runtime's unittest suite, and the kernel job, whose
      # command writes its report and gates it itself) run their command as-is. The tui job
      # also runs as-is in this step shape: `node --test` takes the junit reporter and its
      # destination as its own flags, in the steps right after.
      - name: Test
        if: matrix.report == '' && matrix.node_test_report == ''
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.command }}

      - name: Test (with a vitest JSON report)
        if: matrix.report != ''
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.command }} --reporter=default --reporter=json --outputFile.json=${{ matrix.report }}

      # `node --test` writes no vitest JSON report, so the tui job's command carries its junit
      # reporter (the flags must precede the file list) and this step only makes sure the
      # destination directory exists: node does not create it.
      - name: Test (node --test with a junit report)
        if: matrix.node_test_report != ''
        working-directory: ${{ matrix.package }}
        run: |
          mkdir -p coverage
          ${{ matrix.command }}

      # Fails the job when a suite ran nothing beyond its budget, when a test file failed
      # before its tests ran, when the report fell below its floor, or when this parser and
      # the runner's own summary disagree - the same shapes the vitest gate above catches.
      - name: node --test coverage gate
        if: matrix.node_test_report != ''
        working-directory: ${{ matrix.package }}
        run: >-
          node ../../scripts/check-node-test-coverage.mjs ${{ matrix.node_test_report }}
          --min-tests ${{ matrix.min_tests }}
          --min-ran-tests ${{ matrix.min_ran_tests }}
          --max-nothing-suites ${{ matrix.max_nothing_suites }}

      # Fails the job when a file ran nothing beyond its budget, when a file collected nothing, or
      # when the report fell below its floor, and names the files: a job that quietly stopped
      # running a face of the suite cannot report success.
      - name: Vitest coverage gate
        if: matrix.report != ''
        working-directory: ${{ matrix.package }}
        run: >-
          node ../../scripts/check-vitest-coverage.mjs ${{ matrix.report }}
          --min-tests ${{ matrix.min_tests }}
          --min-ran-tests ${{ matrix.min_ran_tests }}
          --max-nothing-files ${{ matrix.max_nothing_files }}

      # The coverage gate counts floors and files that ran nothing; it cannot see a test that a
      # `tagsFilter` turned into `skipped` inside a file that otherwise runs. Jobs that skip by tag
      # declare what they skip here, and one more (or one fewer) skip is a red job that names it.
      - name: Tag-skip ledger (every skip declared, counted and named)
        if: matrix.tag_skip_ledger != ''
        working-directory: ${{ matrix.package }}
        run: >-
          bash ../../scripts/check-tag-skip-ledger.sh ${{ matrix.report }}
          --ledger "${{ matrix.tag_skip_ledger }}"

  test-hygiene:
    name: Test hygiene
    needs: trust
    if: needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Runs on every CI run, not only when the gate is authored: it plants violating test files in
      # a throwaway git repository and requires the gate to go red, so a matcher that silently stops
      # matching (a regex flavor regression, a broken walk) cannot pass as green.
      - name: Gate self-test (planted violations must turn the gate red)
        run: node scripts/check-test-private-probes.mjs --self-test

      # The coverage gate is the only thing between "a file stopped running" and a green job, so it
      # is proven on every run too: planted all-skipped reports, planted zero-collection and planted
      # floors must turn it red, and the budget must be honoured.
      - name: Coverage gate self-test (planted all-skipped reports must turn the gate red)
        run: node scripts/check-vitest-coverage.mjs --self-test

      # The node --test gate is what covers the tui job (no vitest report there), so its planted
      # red controls run on every CI run too: all-skipped suites, a collapsed total, a file that
      # failed to load and a drifting summary must each turn it red.
      - name: node --test coverage gate self-test (planted all-skipped suites must turn the gate red)
        run: node scripts/check-node-test-coverage.mjs --self-test

      # Offline only, and no npm pin here on purpose: this job installs nothing, and the
      # release-cooldown gate's self-test needs neither npm nor the network. It proves the gate
      # still turns red for npm 10.9.4 and for an `.npmrc` with no real cooldown, so a matcher
      # that stopped matching cannot pass as a green board.
      - name: Release-cooldown gate self-test (planted npm 10.9.4 must turn the gate red)
        run: node scripts/check-npm-release-cooldown.mjs --self-test

      # Diff-scoped and baseline-frozen: the existing stock in scripts/test-private-probe-baseline.json
      # is ignored, anything new under packages/*/test/** fails. BASE_REF is empty or all zeros for a
      # new branch, which the gate reports and then answers from the baseline alone.
      # The two gates above keep tests honest about probes and about running at all; these keep the
      # CI story itself honest: the tests CI cannot run are on a written list, and the "latest run
      # concluded X" answer comes from a query rather than from memory.
      - name: CI honesty gates (tag-skip ledger, platform coverage, latest-run query)
        run: |
          bash scripts/check-tag-skip-ledger.sh --self-test
          bash scripts/check-platform-coverage.sh
          bash scripts/check-platform-coverage.sh --self-test
          bash scripts/latest-ci-run.sh --self-test

      - name: No new private-member probes in tests
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-test-private-probes.mjs --base "$BASE_REF"

  build-check-test:
    name: build-check-test
    if: always() && needs.trust.outputs.allowed == 'true'
    needs: [trust, build-check, test, test-hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_HYGIENE_RESULT: ${{ needs.test-hygiene.result }}
        run: |
          test "$BUILD_CHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$TEST_HYGIENE_RESULT" = success
